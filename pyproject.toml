[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tabbot"
version = "0.1.0"
description = "Local Tableau workbook viewer and insights bot (demo)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "tableauhyperapi",
    "duckdb",
    "pandas",
    "pyarrow",
    "defusedxml",
    "pydantic>=2",
    "plotly",
    "streamlit",
    "anthropic",
    "python-dotenv",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
tabbot = "tabbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm: needs an Anthropic API key (skipped otherwise)",
    "private: uses real workbooks in tests/fixtures/private",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
