[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tabbot"
version = "0.1.0"
description = "Local Tableau workbook viewer and insights bot (demo)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "tableauhyperapi",
    "duckdb",
    "pandas",
    "pyarrow",
    "defusedxml",
    "pydantic>=2",
    "streamlit",
    "anthropic",
    "python-dotenv",
    "pyyaml",
    "xlrd",          # .xls data files inside packages
    "openpyxl",      # .xlsx data files inside packages
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
tabbot = "tabbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not llm'"   # live Claude tests never run by default
markers = [
    "llm: needs an Anthropic API key (skipped otherwise)",
    "private: uses real workbooks in tests/fixtures/private",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# vendored from the parser kit: long XML test snippets and one-off tools, kept as written
"src/tabbot/tparse/*" = ["E501"]
"tests/tparse/*" = ["E501"]
"tests/test_review_superstore.py" = ["E501"]   # inline XML snippets
"tools/*" = ["E501", "B007", "E731"]
# written explanation: long sentence templates read better unbroken
"src/tabbot/explain/*" = ["E501"]
