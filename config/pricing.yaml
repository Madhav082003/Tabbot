# USD per 1 million tokens, used to ESTIMATE cost in the usage log and to enforce the spend limits.
# Check current prices on the Anthropic pricing page / your console; the console bill is the source of truth.
# cache_read = tokens served from the prompt cache; cache_write = tokens written to it (5-minute cache).
models:
  claude-opus-5-5:   {input: 4.00,  output: 20.00, cache_read: 0.20, cache_write: 5.00}
  claude-sonnet-5-5: {input: 2.00,  output: 10.00, cache_read: 0.20, cache_write: 2.50}
  claude-haiku-5-5:  {input: 0.10,  output: 0.50,  cache_read: 0.01, cache_write: 0.125}
  claude-opus-5:     {input: 5.00,  output: 25.00, cache_read: 0.50, cache_write: 6.25}
  claude-opus-4-8:   {input: 5.00,  output: 25.00, cache_read: 0.50, cache_write: 6.25}
  claude-sonnet-5:   {input: 2.00,  output: 10.00, cache_read: 0.20, cache_write: 2.50}
# Any model not listed is priced at this (deliberately high) rate so limits stay safe.
unknown: {input: 10.00, output: 50.00, cache_read: 1.00, cache_write: 12.50}
